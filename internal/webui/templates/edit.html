{{define "content"}}
<h1>{{t "edit_heading"}} {{.Page.Title}}</h1>
<p class="muted">🤖 {{t "edit_propose_help"}}</p>
<form class="editform" method="post" action="/edit/{{.Page.Slug}}">
  <textarea name="body" spellcheck="false">{{.Body}}</textarea>
  <input type="text" name="note" class="proposenote" placeholder="{{t "edit_note_placeholder"}}">
  <div class="editactions">
    <button type="submit">{{t "edit_propose_submit"}}</button>
    <a class="wikilink" href="/page/{{.Page.Slug}}">{{t "edit_cancel"}}</a>
  </div>
</form>
{{end}}
