name: ci

# Fast checks on every push and PR: format, vet, tests, and the CGO-free lite
# build. The full ORT build (semantic search) needs onnxruntime + a native
# tokenizer lib, so it is validated at release time (Homebrew source build),
# not here — this keeps CI quick and green.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the release-lineage check below walks every
          # v* tag against origin/main. A shallow checkout has no tags, which
          # would make that check silently vacuous (zero tags = pass).
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt (invariant F3)
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "these files need gofmt:"; echo "$out"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: tests (invariant F1)
        run: go test ./internal/...
      - name: lite build (CGO-free path, invariant F2)
        run: make build-lite
      - name: translations current (invariant L)
        run: make i18n-check
      - name: release tags on origin/main (invariant J7)
        run: make release-lineage-check
