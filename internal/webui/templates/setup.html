{{define "content"}}
<section class="hero">
  <h1>🌳 {{t "setup_title"}}</h1>
  <p class="muted">{{t "setup_intro"}}<br>
  <b>{{t "setup_code_label"}}</b>{{t "setup_code_desc_a"}} <code>canopy serve</code>{{t "setup_code_desc_b"}}</p>
  {{if .Error}}<p class="notice conflict">{{.Error}}</p>{{end}}
  <form class="authform" method="post" action="/setup">
    <input type="text" name="code" placeholder="{{t "setup_code_placeholder"}}" autofocus required>
    <input type="text" name="id" placeholder="{{t "setup_id_placeholder"}}" autocomplete="username" required>
    <input type="password" name="password" placeholder="{{t "setup_password_placeholder"}}" autocomplete="new-password" minlength="8" required>
    <button type="submit">{{t "setup_submit"}}</button>
  </form>
</section>
{{end}}
