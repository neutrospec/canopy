nav_recent = "최근"
nav_checks = "점검"
nav_random = "랜덤"
nav_logout = "로그아웃"

# --- 공통 ---
search_placeholder = "검색…"
lang_switch_label = "언어"

# --- 홈 (문자열) ---
home_title = "오늘의 주의"
