<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f7f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<title>{{.Title}} · canopy</title>
<link rel="preload" href="/static/vendor/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/chroma.css">
</head>
<body>
<header>
  <a class="brand" href="/">🌳 canopy</a>
  <form class="searchbar" action="/search" method="get">
    <input type="search" name="q" placeholder="{{t "search_placeholder"}}" value="{{.Query}}" autocomplete="off">
  </form>
  <nav>
    <a href="/browse">{{t "nav_browse"}}</a>
    <a href="/graph">{{t "nav_graph"}}</a>
    <a href="/special/discover">{{t "nav_discover"}}</a>
    <a href="/history">{{t "nav_history"}}</a>
    <a href="/special/recent">{{t "nav_recent"}}</a>
    <a href="/special/attention">{{t "nav_checks"}}</a>
    <a href="/special/random">{{t "nav_random"}}</a>
    {{if .AuthOn}}<form method="post" action="/logout" class="logoutform"><button type="submit">{{t "nav_logout"}}</button></form>{{end}}
  </nav>
  <details class="langsel">
    <summary aria-label="{{t "lang_switch_label"}}"><span class="globe" aria-hidden="true">🌐</span>{{.LangName}}</summary>
    <div class="langmenu" role="menu">
      {{range .Langs}}{{if eq .Code $.Lang}}<span class="on" role="menuitemradio" aria-checked="true">{{.Name}}</span>{{else}}<a role="menuitem" href="/setlang?lang={{.Code}}&next={{$.Path}}">{{.Name}}</a>{{end}}{{end}}
    </div>
  </details>
</header>
<main>
{{template "content" .}}
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
