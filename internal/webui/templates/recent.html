{{define "content"}}
<h1>{{t "recent_title"}}</h1>
<table class="logtable">
  <thead><tr><th>{{t "recent_col_time"}}</th><th>{{t "recent_col_action"}}</th><th>{{t "recent_col_page"}}</th><th>{{t "recent_col_note"}}</th></tr></thead>
  <tbody>
  {{range .Rows}}
  <tr>
    <td class="muted">{{.Time}}</td>
    <td><span class="chip">{{.Action}}</span></td>
    <td>{{if .Exists}}<a class="wikilink" href="/page/{{.Slug}}" data-slug="{{.Slug}}">{{.Slug}}</a>{{else}}{{.Slug}}{{end}}</td>
    <td class="muted">{{.Note}}</td>
  </tr>
  {{end}}
  </tbody>
</table>
{{end}}
