# canopy 웹 UI 문자열 (한국어). 새 언어는 active.<lang>.toml을 추가하면 된다
# (docs/web-ui-i18n.md). ID는 snake_case 플랫. 주의: TOML은 [table] 헤더 뒤의
# 모든 키가 그 테이블에 속하므로, 문자열 메시지를 먼저 두고 파라미터·복수형
# 테이블은 파일 끝에 모은다.

# --- 네비게이션 ---
nav_browse = "탐색"
nav_graph = "그래프"
